apiVersion: v1
kind: Service
metadata:
  name: {{ include "clinic-agent.fullname" . }}
  labels: {{- include "clinic-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  selector: {{- include "clinic-agent.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
